  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;

  .tag.year{background:var(--green-soft);color:var(--green)}
  .why{font-size:13.5px;color:#3c3c40;margin:10px 0 0}

  .note{font-size:12.5px;color:var(--amber);margin:6px 0 0}
  .actions{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
  .go{flex:1;min-width:120px;text-align:center;background:var(--ink);color:#fff;
    text-decoration:none;border-radius:10px;padding:9px 12px;font-size:14px}
  .st{display:flex;gap:4px}
  .st button{border:1px solid var(--line);background:#fff;color:var(--sub);
    border-radius:8px;padding:7px 9px;font-size:12px;cursor:pointer}
  .st button.on{background:var(--green-soft);border-color:#bcd8c7;color:var(--green)}

const KEY = "sy-jobs-20261116";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) { state = {}; }
let filter = "all";

const DAY = 86400000;
function daysLeft(dl){
  const t = new Date(dl + "T23:59:59").getTime() - Date.now();
  return Math.ceil(t / DAY);
}
function dlTag(j){
  const n = daysLeft(j.dl);
  if (n < 0) return `<span class="tag dl">已过截止 ${j.dl}</span>`;
  const cls = n <= 14 ? "tag urgent" : "tag dl";
  return `<span class="${cls}">${n === 0 ? "今天截止" : "剩 " + n + " 天"} · ${j.dl}</span>`;
}
function statusOf(id){ return state[id] || ""; }
function matches(j){
  const s = statusOf(j.id);
  if (filter === "high") return j.pri === "high";
  if (filter === "week") { const n = daysLeft(j.dl); return n >= 0 && n <= 14; }
  if (filter === "bj") return j.city.startsWith("北京");
  if (filter === "sh") return j.city.startsWith("上海");
  if (filter === "todo") return s !== "done";
  if (filter === "done") return s === "done";
  return true;
}
function render(){
  const list = document.getElementById("list");
  const jobs = JOBS.filter(matches);
  let html = "", lastDay = "";
  for (const j of jobs){
    if (j.day !== lastDay){ html += `<div class="group">${j.day}</div>`; lastDay = j.day; }
    const s = statusOf(j.id);
    html += `<div class="card ${s === "done" ? "done" : ""}">
      <div class="top">
        <div>
          <div class="co">${j.co}</div>
          <div class="role">${j.role}</div>
        </div>
        <span class="pri ${j.pri === "high" ? "p-high" : "p-mid"}">${j.pri === "high" ? "高优先" : "可投"}</span>
      </div>
      <div class="tags">
        <span class="tag">${j.city}</span>
        <span class="tag">${j.pay}</span>
        <span class="tag">${j.time}</span>
        ${j.year ? `<span class="tag year">${j.year}</span>` : ""}
        ${dlTag(j)}
      </div>
      <div class="why">${j.why}</div>
      ${j.note ? `<div class="note">⚠ ${j.note}</div>` : ""}
      <div class="actions">
        <a class="go" href="${j.url}" target="_blank" rel="noopener">打开岗位</a>
        <div class="st">
          <button data-id="${j.id}" data-v="done" class="${s === "done" ? "on" : ""}">已投</button>
          <button data-id="${j.id}" data-v="interview" class="${s === "interview" ? "on" : ""}">面试</button>
          <button data-id="${j.id}" data-v="reject" class="${s === "reject" ? "on" : ""}">已挂</button>
        </div>
      </div>
    </div>`;
  }
  list.innerHTML = html || `<div class="card">这个筛选下没有岗位。</div>`;
  document.querySelectorAll(".st button").forEach(b => {
    b.onclick = () => {
      const {id, v} = b.dataset;
      state[id] = (state[id] === v) ? "" : v;
      localStorage.setItem(KEY, JSON.stringify(state));
      render(); updateStats();
    };
  });
  updateStats();
}
function updateStats(){
  document.getElementById("s-total").textContent = JOBS.length;
  document.getElementById("s-high").textContent = JOBS.filter(j => j.pri === "high").length;
  document.getElementById("s-week").textContent = JOBS.filter(j => { const n = daysLeft(j.dl); return n >= 0 && n <= 14; }).length;
  document.getElementById("s-done").textContent = JOBS.filter(j => statusOf(j.id) === "done").length;
}
document.querySelectorAll(".chip").forEach(c => {
  c.onclick = () => {
    document.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
    c.classList.add("on");
    filter = c.dataset.f;
    render();
  };
});
render();
