<style>
:root {

}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--fg);
  font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
.topbar {
  position:sticky; top:0; z-index:10; background:rgba(251,251,249,.92);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
  padding:10px 24px; display:flex; gap:16px; align-items:center; font-size:14px;
}
.topbar a { color:var(--accent); text-decoration:none; font-weight:600; }
.topbar a:hover { text-decoration:underline; }
.topbar .crumb { color:var(--muted); }
main { max-width:820px; margin:0 auto; padding:32px 24px 120px; }
h1 { font-size:28px; line-height:1.35; margin:0 0 24px; letter-spacing:-.01em; }
h2 { font-size:21px; margin:40px 0 14px; padding-top:16px; border-top:1px solid var(--line); }
h3 { font-size:17px; margin:28px 0 10px; }
h4 { font-size:16px; margin:22px 0 8px; }
p, li { color:#242424; }
a { color:var(--accent); }
code { background:var(--code-bg); padding:2px 5px; border-radius:4px; font-size:.9em;
        font-family:"JetBrains Mono",Consolas,Menlo,monospace; }
pre { background:var(--code-bg); padding:14px 16px; border-radius:8px; overflow:auto;
       border:1px solid var(--line); font-size:13.5px; line-height:1.6; }
pre code { background:none; padding:0; }
blockquote { margin:16px 0; padding:2px 16px; border-left:3px solid var(--accent);
              background:#f6f8f6; color:#333; }
table { border-collapse:collapse; width:100%; margin:18px 0; font-size:14.5px; display:block; overflow-x:auto; }
th, td { border:1px solid var(--line); padding:8px 12px; text-align:left; vertical-align:top; }
th { background:#f2f1ec; font-weight:600; }
hr { border:none; border-top:1px solid var(--line); margin:32px 0; }
img { max-width:100%; height:auto; }
</style>
</head>
